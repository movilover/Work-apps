# ═══════════════════════════════════════════════════════════════════════
#  WorkHive — Android APK বিল্ডার (এই একটি ফাইলই যথেষ্ট)
#
#  কীভাবে ব্যবহার করবেন:
#   1) নতুন Public GitHub রিপোজিটরি বানান (যেমন WorkHive-Android)
#   2) এই ফাইলটা রিপোজিটরিতে  .github/workflows/build-apk.yml  নামে রাখুন
#   3) নিচের SITE_URL লাইনে আপনার ইউজার সাইটের লিংক ঠিক আছে কি না দেখুন
#   4) Actions ট্যাব → "Build WorkHive APK" → Run workflow
#   5) ৫–৮ মিনিট পর APK লিংক:
#      https://github.com/<আপনার-ইউজারনেম>/<রিপোজিটরি-নাম>/releases/download/latest/WorkHive.apk
# ═══════════════════════════════════════════════════════════════════════
name: Build WorkHive APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ★★★ শুধু এই একটি লাইন দরকার হলে বদলাবেন — আপনার ইউজার সাইটের লিংক (শেষে / সহ) ★★★
  SITE_URL: "https://workhive.pro/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Android project
        run: |
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- deep emerald glow instead of a flat black square -->
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:type="radial"
                  android:centerX="0.5"
                  android:centerY="0.42"
                  android:gradientRadius="78%p"
                  android:startColor="#10402A"
                  android:endColor="#030906" />
          </shape>
          EOF
          cat > "settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'WorkHive'
          include ':app'
          EOF
          cat > "build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > "gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          EOF
          mkdir -p "app"
          cat > "app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.workhive.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.workhive.app'
                  minSdk 26            // Android 8.0+
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              // The signing key is given by GitHub Actions (secrets). Without it the
              // build still works (debug key) — but updates over an old install need the same key.
              signingConfigs {
                  release {
                      def ks = System.getenv('KEYSTORE_PATH')
                      if (ks != null && new File(ks).exists()) {
                          storeFile file(ks)
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      } else {
                          initWith signingConfigs.debug
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // Push notifications (OneSignal). The range picks the newest 5.1.x release that works with compileSdk 34.
              implementation 'com.onesignal:OneSignal:[5.1.12,5.1.22]'
          }
          EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p "app/src/main/java/com/workhive/app"
          cat > "app/src/main/java/com/workhive/app/MainActivity.java" <<'EOF'
          package com.workhive.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.os.Build;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.Animation;
          import android.view.animation.ScaleAnimation;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import com.onesignal.Continue;
          import com.onesignal.OneSignal;

          import java.lang.reflect.InvocationHandler;
          import java.lang.reflect.Method;
          import java.lang.reflect.Proxy;

          import org.json.JSONObject;

          /**
           * WorkHive app shell.
           *
           * The app shows your live website (site_url in res/values/config.xml) inside a
           * WebView, so every website update appears in the app automatically.
           *
           *  - Branded splash (logo) until the website is ready - no raw loading bar.
           *  - Back button: asks the website (window.__whBack) to close a popup / go back;
           *    on the Home screen: "press back again to exit".
           *  - Push notifications: OneSignal runs natively; the website tells the app which
           *    user logged in (window.WorkHiveNative.oneSignalLogin).
           */
          public class MainActivity extends Activity {

              private static final int FILE_REQ = 1001;
              private static final String BG = "#070707";
              private static final long SPLASH_MIN_MS = 900;
              private static final long SPLASH_MAX_MS = 7000;

              private WebView web;
              private FrameLayout splash;
              private ValueCallback<Uri[]> filePathCallback;
              private long lastBackAt = 0;
              private long splashShownAt = 0;
              private boolean splashHidden = false;
              private boolean showingOffline = false;
              private String pendingScreen = null;
              private String siteUrl;
              private String siteHost;
              private final Handler ui = new Handler(Looper.getMainLooper());

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  siteUrl = getString(R.string.site_url).trim();
                  Uri parsed = Uri.parse(siteUrl);
                  siteHost = parsed.getHost() == null ? "" : parsed.getHost();

                  getWindow().setStatusBarColor(Color.parseColor(BG));
                  getWindow().setNavigationBarColor(Color.parseColor(BG));

                  initPush();

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor(BG));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor(BG));
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  buildSplash();
                  root.addView(splash, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // Firebase login is kept here
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setSupportZoom(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setAllowFileAccess(true);            // only used for the bundled offline page
                  s.setAllowContentAccess(true);
                  // The website looks for this marker: it skips the landing page and
                  // hides the Google button (Google blocks sign-in inside WebViews).
                  s.setUserAgentString(s.getUserAgentString() + " WorkHiveApp/1.0");

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.addJavascriptInterface(new Bridge(), "WorkHiveNative");
                  web.setWebViewClient(new AppClient());
                  web.setWebChromeClient(new AppChrome());
                  web.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition,
                                                  String mimeType, long contentLength) {
                          startDownload(url, userAgent, contentDisposition, mimeType);
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(siteUrl);
                  }

                  // safety: never keep the splash forever
                  ui.postDelayed(new Runnable() {
                      @Override public void run() { hideSplash(); }
                  }, SPLASH_MAX_MS);
              }

              // ───────────────────────── push notifications ─────────────────────────
              private void initPush() {
                  createPushChannel();
                  try {
                      OneSignal.initWithContext(this, getString(R.string.onesignal_app_id));
                      OneSignal.getNotifications().requestPermission(false, Continue.none());
                  } catch (Throwable t) {
                      // push must never stop the app from opening
                  }
                  registerPushClickListener();
              }

              /** High-priority channel with the "tung tung" sound (res/raw/tung.wav). The push server targets it by id. */
              private void createPushChannel() {
                  if (Build.VERSION.SDK_INT < 26) return;
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      NotificationChannel ch = new NotificationChannel("workhive_alerts", "WorkHive Alerts", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Withdraw, job and task updates");
                      AudioAttributes aa = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build();
                      ch.setSound(Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.tung), aa);
                      ch.enableVibration(true);
                      ch.setVibrationPattern(new long[]{0, 180, 120, 180});
                      ch.enableLights(true);
                      ch.setLightColor(Color.parseColor("#00E676"));
                      nm.createNotificationChannel(ch);
                  } catch (Throwable ignored) { }
              }

              /**
               * When the user taps a push notification, open the matching screen inside the app.
               * Registered through reflection so a change in the OneSignal API can never break the build.
               */
              private void registerPushClickListener() {
                  try {
                      Class<?> listenerCls = Class.forName("com.onesignal.notifications.INotificationClickListener");
                      Object listener = Proxy.newProxyInstance(listenerCls.getClassLoader(), new Class<?>[]{listenerCls}, new InvocationHandler() {
                          @Override
                          public Object invoke(Object proxy, Method method, Object[] args) {
                              if ("onClick".equals(method.getName()) && args != null && args.length > 0) {
                                  String screen = "notifications";
                                  try {
                                      Object notification = args[0].getClass().getMethod("getNotification").invoke(args[0]);
                                      Object data = notification.getClass().getMethod("getAdditionalData").invoke(notification);
                                      if (data instanceof JSONObject) {
                                          String sc = ((JSONObject) data).optString("screen", "");
                                          if (!sc.isEmpty()) screen = sc;
                                      }
                                  } catch (Throwable ignored) { }
                                  final String target = screen;
                                  runOnUiThread(new Runnable() {
                                      @Override public void run() { openScreenFromPush(target); }
                                  });
                              }
                              return null;
                          }
                      });
                      Object notifications = OneSignal.getNotifications();
                      for (Method m : notifications.getClass().getMethods()) {
                          if ("addClickListener".equals(m.getName()) && m.getParameterTypes().length == 1) {
                              m.invoke(notifications, listener);
                              break;
                          }
                      }
                  } catch (Throwable ignored) { }
              }

              private void openScreenFromPush(String screen) {
                  pendingScreen = screen;
                  if (splashHidden) runPendingScreen();     // otherwise it runs as soon as the website is ready
              }

              private void runPendingScreen() {
                  if (pendingScreen == null || web == null) return;
                  final String sc = pendingScreen.replace("'", "").replace("\\", "");
                  pendingScreen = null;
                  web.evaluateJavascript("(function(){try{if(window.__whPushOpen)window.__whPushOpen('" + sc + "');}catch(e){}})()", null);
              }

              // ───────────────────────── splash ─────────────────────────
              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void buildSplash() {
                  splash = new FrameLayout(this);
                  splash.setBackgroundColor(Color.parseColor(BG));
                  splash.setClickable(true);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  logo.setAdjustViewBounds(true);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  col.addView(logo, new LinearLayout.LayoutParams(dp(230), ViewGroup.LayoutParams.WRAP_CONTENT));

                  ProgressBar bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setIndeterminate(true);
                  bar.getIndeterminateDrawable().setColorFilter(Color.parseColor("#00E676"), android.graphics.PorterDuff.Mode.SRC_IN);
                  LinearLayout.LayoutParams barLp = new LinearLayout.LayoutParams(dp(130), dp(3));
                  barLp.topMargin = dp(26);
                  col.addView(bar, barLp);

                  FrameLayout.LayoutParams colLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                  splash.addView(col, colLp);

                  ScaleAnimation pulse = new ScaleAnimation(1f, 1.07f, 1f, 1.07f,
                          Animation.RELATIVE_TO_SELF, 0.5f, Animation.RELATIVE_TO_SELF, 0.5f);
                  pulse.setDuration(1100);
                  pulse.setRepeatMode(Animation.REVERSE);
                  pulse.setRepeatCount(Animation.INFINITE);
                  logo.startAnimation(pulse);

                  splashShownAt = SystemClock.elapsedRealtime();
              }

              private void hideSplash() {
                  if (splashHidden || splash == null) return;
                  long wait = SPLASH_MIN_MS - (SystemClock.elapsedRealtime() - splashShownAt);
                  Runnable go = new Runnable() {
                      @Override public void run() {
                          if (splashHidden) return;
                          splashHidden = true;
                          splash.animate().alpha(0f).setDuration(380).withEndAction(new Runnable() {
                              @Override public void run() { splash.setVisibility(View.GONE); runPendingScreen(); }
                          }).start();
                      }
                  };
                  if (wait > 0) ui.postDelayed(go, wait); else go.run();
              }

              // ───────────────────────── back button ─────────────────────────
              @Override
              public void onBackPressed() {
                  if (showingOffline) {
                      exitOnDoubleBack();
                      return;
                  }
                  final String js = "(function(){try{return window.__whBack?(window.__whBack()?'1':'0'):'N';}catch(e){return 'N';}})()";
                  web.evaluateJavascript(js, new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if ("\"1\"".equals(value)) return;                       // website handled it
                          if ("\"N\"".equals(value) && web.canGoBack()) {          // some other page
                              web.goBack();
                              return;
                          }
                          exitOnDoubleBack();
                      }
                  });
              }

              private void exitOnDoubleBack() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackAt < 2000) {
                      finish();
                  } else {
                      lastBackAt = now;
                      Toast.makeText(this, "বের হতে আবার ব্যাক চাপুন", Toast.LENGTH_SHORT).show();
                  }
              }

              // ───────────────────────── links ─────────────────────────
              private boolean isInternal(Uri u) {
                  String scheme = u.getScheme();
                  if (scheme == null) return false;
                  if ("file".equals(scheme) || "about".equals(scheme) || "data".equals(scheme) || "blob".equals(scheme)) return true;
                  String host = u.getHost();
                  if (host == null) return false;
                  return host.equals(siteHost) || host.endsWith("." + siteHost) || host.endsWith(".firebaseapp.com");
              }

              private boolean openExternal(Uri u) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addCategory(Intent.CATEGORY_BROWSABLE);
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(this, "লিংকটি খোলার মতো অ্যাপ পাওয়া যায়নি", Toast.LENGTH_SHORT).show();
                  } catch (Exception ignored) { }
                  return true;
              }

              private class AppClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                      Uri u = request.getUrl();
                      if (isInternal(u)) return false;
                      return openExternal(u);           // Facebook, YouTube, tel:, mailto:, tg: ...
                  }

                  @Override
                  public void onPageStarted(WebView view, String url, Bitmap favicon) {
                      super.onPageStarted(view, url, favicon);
                      if (url != null && !url.startsWith("file:")) showingOffline = false;
                  }

                  @Override
                  public void onPageFinished(WebView view, String url) {
                      super.onPageFinished(view, url);
                      CookieManager.getInstance().flush();
                      if (url != null && url.startsWith("file:")) hideSplash();   // offline page
                  }

                  @Override
                  public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                      super.onReceivedError(view, request, error);
                      if (request.isForMainFrame()) {
                          showingOffline = true;
                          view.loadUrl("file:///android_asset/offline.html");
                      }
                  }
              }

              private class AppChrome extends WebChromeClient {
                  // image / file upload (task proof, KYC, avatar ...)
                  @Override
                  public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> callback,
                                                   FileChooserParams params) {
                      if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                      filePathCallback = callback;
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      String[] types = params.getAcceptTypes();
                      String first = (types != null && types.length > 0 && types[0] != null && !types[0].isEmpty()) ? types[0] : "*/*";
                      i.setType(first);
                      if (params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      }
                      try {
                          startActivityForResult(Intent.createChooser(i, "ফাইল বেছে নিন"), FILE_REQ);
                      } catch (ActivityNotFoundException e) {
                          filePathCallback = null;
                          return false;
                      }
                      return true;
                  }

                  // window.open(...) -> open outside (or inside if it is our own site)
                  @Override
                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                      final WebView temp = new WebView(MainActivity.this);
                      temp.setWebViewClient(new WebViewClient() {
                          private boolean handled = false;

                          private void handle(String url) {
                              if (handled || url == null || url.equals("about:blank")) return;
                              handled = true;
                              Uri u = Uri.parse(url);
                              if (isInternal(u)) web.loadUrl(url); else openExternal(u);
                              new Handler(Looper.getMainLooper()).post(new Runnable() {
                                  @Override public void run() { temp.destroy(); }
                              });
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                              handle(r.getUrl().toString());
                              return true;
                          }

                          @Override
                          public void onPageStarted(WebView v, String url, Bitmap f) {
                              handle(url);
                          }
                      });
                      WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                      transport.setWebView(temp);
                      resultMsg.sendToTarget();
                      return true;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQ) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              results = new Uri[n];
                              for (int k = 0; k < n; k++) results[k] = data.getClipData().getItemAt(k).getUri();
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              // ───────────────────────── downloads ─────────────────────────
              private void startDownload(String url, String userAgent, String contentDisposition, String mimeType) {
                  if (url == null || !url.startsWith("http")) { openExternal(Uri.parse(url == null ? "" : url)); return; }
                  try {
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      req.setMimeType(mimeType);
                      req.addRequestHeader("User-Agent", userAgent);
                      req.setTitle(name);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm != null) {
                          dm.enqueue(req);
                          Toast.makeText(this, "ডাউনলোড শুরু হয়েছে…", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Exception e) {
                      openExternal(Uri.parse(url));
                  }
              }

              // ───────────────────────── bridge to the website ─────────────────────────
              public class Bridge {
                  /** offline page -> retry */
                  @JavascriptInterface
                  public void retry() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              showingOffline = false;
                              web.loadUrl(siteUrl);
                          }
                      });
                  }

                  /** the website finished its own start-up -> remove the splash */
                  @JavascriptInterface
                  public void appReady() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { hideSplash(); }
                      });
                  }

                  /** push notifications: link this phone to the logged-in user (Firebase UID) */
                  @JavascriptInterface
                  public void oneSignalLogin(final String uid) {
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              try { if (uid != null && !uid.isEmpty()) OneSignal.login(uid); } catch (Throwable ignored) { }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void oneSignalLogout() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              try { OneSignal.logout(); } catch (Throwable ignored) { }
                          }
                      });
                  }
              }

              // ───────────────────────── lifecycle ─────────────────────────
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (web != null) web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacksAndMessages(null);
                  if (web != null) {
                      ViewGroup parent = (ViewGroup) web.getParent();
                      if (parent != null) parent.removeView(web);
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
