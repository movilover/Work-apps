      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Fixed signing key (GitHub Secrets) so every new APK can update the old one.
      # Without secrets the build still works (debug key) — fine for the first test.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/workhive.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/workhive.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using fixed signing key."
          else
            echo "No signing secrets found - using the debug key."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WorkHive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkHive-APK
          path: dist/WorkHive.apk

      - name: Publish to Releases (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WorkHive APK (latest)
          body: Latest WorkHive Android app. Download WorkHive.apk below.
          files: dist/WorkHive.apk
          make_latest: true
